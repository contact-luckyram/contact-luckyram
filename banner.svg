<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-label="Lucky Ram — Full-Stack Developer · Laravel · Node.js · Agentic AI">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="0.55" stop-color="#1a1238"/>
      <stop offset="1" stop-color="#2a1050"/>
    </linearGradient>
    <radialGradient id="glow1" cx="0.12" cy="1" r="0.6">
      <stop offset="0" stop-color="#ff2d20" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#ff2d20" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="0.85" cy="0.1" r="0.55">
      <stop offset="0" stop-color="#7c3aed" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#7c3aed" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff2d20"/>
      <stop offset="0.25" stop-color="#f59e0b"/>
      <stop offset="0.5" stop-color="#22c55e"/>
      <stop offset="0.75" stop-color="#3b82f6"/>
      <stop offset="1" stop-color="#a855f7"/>
    </linearGradient>
    <linearGradient id="aiText" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#ffffff" stroke-opacity="0.035" stroke-width="1"/>
    </pattern>
    <style>
      .mono { font-family: 'Fira Code', 'JetBrains Mono', Consolas, monospace; }
      .sans { font-family: 'Segoe UI', 'Inter', 'Helvetica Neue', Arial, sans-serif; }
      .chip { font-family: 'Fira Code', Consolas, monospace; font-size: 13px; font-weight: 600; text-anchor: middle; }
      .cursor { animation: blink 1s steps(1) infinite; }
      @keyframes blink { 50% { opacity: 0; } }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1200" height="320" rx="14" fill="url(#bg)"/>
  <rect width="1200" height="320" rx="14" fill="url(#grid)"/>
  <rect width="1200" height="320" rx="14" fill="url(#glow1)"/>
  <rect width="1200" height="320" rx="14" fill="url(#glow2)"/>

  <!-- Left: text -->
  <text x="64" y="70" class="mono" font-size="15" fill="#8b93b8">&lt;?php echo "Hello, World 👋"; ?&gt;</text>
  <text x="62" y="138" class="sans" font-size="64" font-weight="800" fill="#ffffff">Lucky Ram</text>
  <text x="64" y="178" class="sans" font-size="23" font-weight="600" fill="#c7d2fe">Full-Stack Developer · Laravel · Node.js · <tspan fill="url(#aiText)" font-weight="700">Agentic AI</tspan></text>
  <text x="64" y="208" class="sans" font-size="15" fill="#9aa3c7" textLength="590" lengthAdjust="spacingAndGlyphs">Automating US healthcare systems · EVV integrations · AI-powered FinTech apps</text>

  <!-- Chips row 1: stack -->
  <g transform="translate(64,230)">
    <rect x="0" y="0" width="62" height="28" rx="14" fill="#ff2d20" fill-opacity="0.18" stroke="#ff2d20" stroke-opacity="0.6"/>
    <text x="31" y="19" class="chip" fill="#fecaca">PHP</text>
    <rect x="72" y="0" width="86" height="28" rx="14" fill="#ff2d20" fill-opacity="0.18" stroke="#ff2d20" stroke-opacity="0.6"/>
    <text x="115" y="19" class="chip" fill="#fecaca">Laravel</text>
    <rect x="168" y="0" width="92" height="28" rx="14" fill="#f59e0b" fill-opacity="0.18" stroke="#f59e0b" stroke-opacity="0.6"/>
    <text x="214" y="19" class="chip" fill="#fde68a">Filament</text>
    <rect x="270" y="0" width="86" height="28" rx="14" fill="#22c55e" fill-opacity="0.18" stroke="#22c55e" stroke-opacity="0.6"/>
    <text x="313" y="19" class="chip" fill="#bbf7d0">Node.js</text>
    <rect x="366" y="0" width="74" height="28" rx="14" fill="#3b82f6" fill-opacity="0.18" stroke="#3b82f6" stroke-opacity="0.6"/>
    <text x="403" y="19" class="chip" fill="#bfdbfe">MySQL</text>
  </g>

  <!-- Chips row 2: AI -->
  <g transform="translate(64,266)">
    <rect x="0" y="0" width="118" height="28" rx="14" fill="#a855f7" fill-opacity="0.22" stroke="#a855f7" stroke-opacity="0.75"/>
    <text x="59" y="19" class="chip" fill="#e9d5ff">🤖 Agentic AI</text>
    <rect x="128" y="0" width="118" height="28" rx="14" fill="#d97757" fill-opacity="0.22" stroke="#d97757" stroke-opacity="0.75"/>
    <text x="187" y="19" class="chip" fill="#fed7c7">Claude Code</text>
    <rect x="256" y="0" width="62" height="28" rx="14" fill="#22d3ee" fill-opacity="0.18" stroke="#22d3ee" stroke-opacity="0.7"/>
    <text x="287" y="19" class="chip" fill="#cffafe">MCP</text>
    <rect x="328" y="0" width="112" height="28" rx="14" fill="#10b981" fill-opacity="0.18" stroke="#10b981" stroke-opacity="0.7"/>
    <text x="384" y="19" class="chip" fill="#a7f3d0">LLM APIs</text>
  </g>

  <!-- Right: code window -->
  <g transform="translate(700,46)">
    <rect width="440" height="232" rx="12" fill="#0d1224" fill-opacity="0.92" stroke="#ffffff" stroke-opacity="0.08"/>
    <rect width="440" height="34" rx="12" fill="#151b33"/>
    <rect y="22" width="440" height="12" fill="#151b33"/>
    <circle cx="20" cy="17" r="6" fill="#ff5f57"/>
    <circle cx="40" cy="17" r="6" fill="#febc2e"/>
    <circle cx="60" cy="17" r="6" fill="#28c840"/>
    <text x="220" y="22" class="mono" font-size="13" fill="#6b7393" text-anchor="middle">Developer.php</text>

    <g class="mono" font-size="14.5">
      <text x="22" y="66"><tspan fill="#c084fc">class</tspan> <tspan fill="#fbbf24">LuckyRam</tspan> <tspan fill="#e5e7eb">{</tspan></text>
      <text x="40" y="92"><tspan fill="#c084fc">public</tspan> <tspan fill="#93c5fd">$stack</tspan> <tspan fill="#e5e7eb">= [</tspan><tspan fill="#86efac">'Laravel'</tspan><tspan fill="#e5e7eb">, </tspan><tspan fill="#86efac">'Filament'</tspan><tspan fill="#e5e7eb">,</tspan></text>
      <text x="58" y="116"><tspan fill="#86efac">'Node.js'</tspan><tspan fill="#e5e7eb">, </tspan><tspan fill="#86efac">'REST APIs'</tspan><tspan fill="#e5e7eb">];</tspan></text>
      <text x="40" y="146"><tspan fill="#c084fc">public</tspan> <tspan fill="#93c5fd">$ai</tspan> <tspan fill="#e5e7eb">= [</tspan><tspan fill="#86efac">'Agentic AI'</tspan><tspan fill="#e5e7eb">, </tspan><tspan fill="#86efac">'Claude Code'</tspan><tspan fill="#e5e7eb">,</tspan></text>
      <text x="58" y="170"><tspan fill="#86efac">'MCP'</tspan><tspan fill="#e5e7eb">, </tspan><tspan fill="#86efac">'LLM APIs'</tspan><tspan fill="#e5e7eb">];</tspan></text>
      <text x="22" y="196"><tspan fill="#e5e7eb">}</tspan></text>
      <text x="22" y="220"><tspan fill="#6b7393">// shipping clean code with AI agents</tspan><tspan class="cursor" fill="#e5e7eb">▌</tspan></text>
    </g>
  </g>

  <!-- Bottom rainbow bar -->
  <rect x="0" y="314" width="1200" height="6" fill="url(#bar)"/>
</svg>
